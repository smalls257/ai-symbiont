      - patterns:
          - pattern: |-
              logging.getLogger(...).$M(..., f"...{$X}...", ...)
          - metavariable-regex:
              metavariable: $X
              regex: |-
                (?is)^(?![rbfuRBFU]{0,2}[\"'])(?!len\().*(?:^|[^A-Za-z0-9])(?:\w*_)?(?:prompt|transcripts?|messages?|completions?|observations?|repl(?:y|ies)|text|body|content|payload)s?(?!_(?:tokens?|chars|len|count|size|bytes|number|ids?)\b)(?:_\w+)?(?:[^A-Za-z0-9]|$).*$
      - patterns:
