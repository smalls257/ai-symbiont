  - id: sym-subprocess-literal-command
    severity: ERROR
    languages: [python]
    message: >
      A process started from a command that is a variable, a concatenation or an f-string hides
      what it runs from sym-network-subprocess (a second HTTP client by the back door). Pass a
      list whose first element is a string literal, or a literal string. Allowed set for a
      computed command: no module today; adding one is an edit of this rule (GATE-CHANGE) with
      the module named in the exclude list below.
    paths:
      include: ["/src/"]
      exclude: ["/src/symbiont/egress/"]
    pattern-either:
      - patterns:
          - pattern: subprocess.$F($A, ...)
          - pattern-not: subprocess.$F(["...", ...], ...)
          - pattern-not: subprocess.$F("...", ...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(run|call|check_call|check_output|Popen|getoutput|getstatusoutput)$
      - patterns:
          - pattern-either:
              - pattern: os.system($A)
              - pattern: os.popen($A, ...)
          - pattern-not: os.system("...")
          - pattern-not: os.popen("...", ...)
